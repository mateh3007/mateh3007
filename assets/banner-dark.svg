  <text x="64" y="196" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#94a3b8">Engineering systems. Exploring intelligence. Building what's next.</text>
  <g font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2.5" fill="#94a3b8">
