    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55"><stop offset="0" stop-color="#78a9f5" stop-opacity="0.22"/><stop offset="1" stop-color="#78a9f5" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1d3048" stroke-width="1" opacity="0.5"/></pattern>
